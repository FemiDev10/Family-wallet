<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Wallet Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column, sticky header, tab bar at the bottom, bottom sheets for buying and asking. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#F4F6FA; --line:#DCE2EE; --ink:#17203A; --muted:#5B6682; --faint:#98A1B8;
  --accent:#3F51D8; --accent-soft:#E6E9FF; --good:#1E8A58; --good-soft:#E1F4EA; --warn:#A86300; --warn-soft:#FFF1D9;
  --stop:#D23B3B; --stop-soft:#FDE6E6; --paused:#6B7390; --paused-soft:#ECEEF3; --bezel:#1B1F2B;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}

.stage{height:100%;display:grid;place-items:center}
.phone{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
@media (min-width:600px){ html:not(.embedded) .phone{width:390px;height:min(844px,calc(100% - 40px));border-radius:48px;border:12px solid var(--bezel);box-shadow:0 30px 80px rgba(23,32,58,.25)} }
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-weight:600;font-size:14px;padding-top:max(12px,env(safe-area-inset-top))}
.sbar .ic{display:flex;gap:6px;align-items:center}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 20px 12px}
.hdr .av{width:40px;height:40px;border-radius:50%;background:#FBE3EC;color:#B83266;display:grid;place-items:center;font-weight:700}
.hdr b{display:block;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.hdr small{color:var(--muted);font-size:13px}
.hdr .sp{flex:1}
.bell{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.bell .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--stop);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.body{flex:1;overflow:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}
.screen{display:none;flex-direction:column;gap:14px}
.screen.on{display:flex;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001;transform:translateY(8px)}}
h2{font-family:var(--display);font-size:17px;margin:4px 2px 0;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:filter .4s,opacity .4s}
.card.new{animation:pop .9s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.9);opacity:0}50%{box-shadow:0 0 0 3px var(--accent)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.card.flash{animation:flash .9s ease}
@keyframes flash{30%{box-shadow:0 0 0 3px var(--accent)}}
.top{display:flex;align-items:center;gap:12px}
.aic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.aic .i{width:22px;height:22px}
.top .n{flex:1;min-width:0}
.top .n b{display:block;font-weight:700;font-size:16px}
.top .n small{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.active{background:var(--good-soft);color:var(--good)}
.pill.paused{background:var(--paused-soft);color:var(--paused)}
.pill.expired{background:var(--warn-soft);color:var(--warn)}
.left{display:flex;align-items:flex-end;justify-content:space-between}
.left .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.left small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.left .wk{text-align:right;color:var(--muted);font-size:13px}
.left .wk b{display:block;color:var(--ink);font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i.warn{background:var(--warn)} .bar i.full{background:var(--stop)}
.limits{background:var(--sunk);border-radius:16px;padding:4px 12px}
.limits div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.limits div:last-child{border-bottom:0}
.limits span{color:var(--muted)}
.limits b{font-weight:600;text-align:right}
.setby{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.setby .i{width:14px;height:14px}
.note{border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.p{background:var(--paused-soft);color:var(--ink)}
.note.w{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.stop{background:var(--stop);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}

.rep{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--accent);border-radius:18px;padding:12px 14px;text-align:left;animation:in .4s ease}
.rep .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.rep .n{flex:1;min-width:0} .rep b{display:block;font-weight:700} .rep small{color:var(--muted);font-size:12.5px}
.rep>.i{transform:rotate(90deg);color:var(--accent)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .circ{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .circ .i{width:28px;height:28px}
.empty b{color:var(--ink);font-size:16px}
.waiting{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);font-weight:600}
.waiting i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

.prod{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.prod .tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.prod .n{flex:1;min-width:0}
.prod .n b{display:block;font-weight:600;font-size:14.5px}
.prod .n small{color:var(--muted);font-size:12.5px}
.prod .buy{min-height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.prod .buy:disabled{opacity:.35}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.li .ic .i{width:16px;height:16px}
.li .n{flex:1;min-width:0;font-size:14px}
.li .n small{display:block;color:var(--muted);font-size:12.5px}
.li .amt{font-weight:700}
.li.no .amt{color:var(--stop);text-decoration:line-through}
.ok-ic{background:var(--good-soft);color:var(--good)} .no-ic{background:var(--stop-soft);color:var(--stop)} .in-ic{background:var(--accent-soft);color:var(--accent)} .pa-ic{background:var(--paused-soft);color:var(--paused)}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint);position:relative}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--stop)}

.scrim{position:absolute;inset:0;background:rgba(23,32,58,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px 22px;z-index:11;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-family:var(--display);font-size:20px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px;opacity:0;transform:translateX(-6px);animation:ck .3s ease forwards}
.checks div .c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.checks div .c .i{width:13px;height:13px;stroke-width:2.6}
.checks .p .c{background:var(--good-soft);color:var(--good)}
.checks .f{box-shadow:inset 0 0 0 1.5px var(--stop)}
.checks .f .c{background:var(--stop-soft);color:var(--stop)}
.checks .s{opacity:.4!important}
.checks .s .c{background:var(--line);color:var(--faint)}
@keyframes ck{to{opacity:1;transform:none}}
.verdict{border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;opacity:0;animation:ck .35s ease forwards}
.verdict .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict .c .i{width:24px;height:24px;stroke-width:2.6}
.verdict.ok{background:var(--good-soft)} .verdict.ok .c{background:var(--good);color:#fff}
.verdict.no{background:var(--stop-soft)} .verdict.no .c{background:var(--stop);color:#fff}
.verdict b{display:block;font-size:16px}
.verdict small{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);font-size:22px;font-weight:600}
.stepper .v{font-family:var(--display);font-size:40px;font-weight:700;min-width:120px;text-align:center}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(23,32,58,.1)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:0 14px;outline:none;width:100%}
.inp:focus{border-color:var(--accent)}

.banner{position:absolute;top:10px;left:10px;right:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(23,32,58,.18);z-index:20;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.banner.on{transform:none}
.banner .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.banner p{margin:0;font-size:13.5px;flex:1}
.banner p b{display:block;font-size:14px}
.banner small{color:var(--muted);font-size:11.5px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body>
<div class="stage"><div class="phone" id="phone">
  <div class="sbar"><span id="clock">9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="hdr"><div class="av" id="meAv">D</div><div><b id="meHi">Hi, David</b><small id="meSub">Family wallet · set up by Parent A</small></div><div class="sp"></div><button class="bell" id="bellBtn" aria-label="Alerts"></button></div>
  <div class="body" id="body">
    <section class="screen on" id="s-home"></section>
    <section class="screen" id="s-shop"></section>
    <section class="screen" id="s-activity"></section>
    <section class="screen" id="s-alerts"></section>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="home"></button><button class="tab" data-tab="shop"></button><button class="tab" data-tab="activity"></button><button class="tab" data-tab="alerts"></button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="banner" id="banner" aria-live="polite"></div>
</div></div>

<script>
(()=>{
if(window.self!==window.top)document.documentElement.classList.add('embedded');
const P={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',code:'<path d="m8 7-5 5 5 5M16 7l5 5-5 5"/>',plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2.2l2.6 12.2a1.5 1.5 0 0 0 1.5 1.3h9a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h14"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',megaphone:'<path d="m3 11 15-6v14L3 13z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/>',
home:'<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',bag:'<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',check:'<path d="m5 12 5 5L20 7"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',pause:'<path d="M9 5v14M15 5v14"/>'};
const FILLED={stop:'<rect x="6" y="6" width="12" height="12" rx="2.5"/>',play:'<path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z"/>'};
const I=(n)=>FILLED[n]?`<svg class="i fill" viewBox="0 0 24 24" aria-hidden="true">${FILLED[n]}</svg>`:`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp=n=>'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const gbpS=n=>n%1===0?'£'+n:gbp(n);
const DAY=864e5, sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x}, sow=d=>{const x=sod(d);return new Date(x-((x.getDay()+6)%7)*DAY)};
const r2=n=>Math.round(n*100)/100;
const fmtTime=d=>d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const ago=d=>{const s=(Date.now()-d)/1000;if(s<45)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'};
const rid=p=>p+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);
const ME='ada';
const nm=id=>{if(id===ME)return'you';if(id==='system')return'System';const m=st&&st.members&&st.members.find(x=>x.id===id);return m?m.short:(id==='femi'?'${PA()}':id==='bunmi'?'Parent B':'A parent')};
const PA=()=>nm('femi');
const meM=()=>st&&st.members?st.members.find(x=>x.id===ME):{name:'David',short:'David',ini:'D'};
const ADMIN_NAME=new Proxy({},{get:(_,k)=>nm(k)});

/* ---------- shared store ---------- */
const KEY='fw-state-v1', DATE_KEYS=['expires','pausedAt','t','dt'];
const bc='BroadcastChannel' in window?new BroadcastChannel('fw-sync'):null;
let st=null, lastSaved='', tab='home', shopAgent=null, sheet=null, seenAlerts=0, booted=false;
const parse=str=>JSON.parse(str,(k,v)=>DATE_KEYS.includes(k)&&typeof v==='string'?new Date(v):v);
function load(){try{const s=localStorage.getItem(KEY);if(s){st=parse(s);lastSaved=s}else st=null}catch(e){st=null}}
function save(){const s=JSON.stringify(st);lastSaved=s;sendOut(s);try{localStorage.setItem(KEY,s)}catch(e){}bc&&bc.postMessage({type:'state',str:s})}
function onRemote(str){
  if(!str||str===lastSaved)return;
  const prev=st; st=parse(str); lastSaved=str;try{localStorage.setItem(KEY,str)}catch(e){}
  if(prev) notifyDiff(prev,st);
  render();
}
bc&&(bc.onmessage=e=>{if(e.data.type==='state')onRemote(e.data.str);if(e.data.type==='reset')setTimeout(()=>location.reload(),300)});
addEventListener('storage',e=>{if(e.key===KEY){if(e.newValue)onRemote(e.newValue);else setTimeout(()=>location.reload(),300)}});

/* ---------- derived ---------- */
const mine=()=>st?st.agents.filter(a=>a.sponsor===ME&&a.status!=='revoked'):[];
const ag=id=>st.agents.find(a=>a.id===id);
const okSum=(aid,from)=>r2(st.tx.filter(t=>t.ok&&t.agent===aid&&t.t>=from).reduce((s,t)=>s+t.amount,0));
const today=aid=>okSum(aid,sod(new Date())), week=aid=>okSum(aid,sow(new Date()));
const pendingReq=aid=>st.requests.find(r=>r.agent===aid&&r.status==='pending');
function alerts(){
  if(!st)return[];
  const ids=new Set(st.agents.filter(a=>a.sponsor===ME).map(a=>a.id));
  const out=st.audit.filter(e=>ids.has(e.target)&&e.who!==ME).map(e=>({t:e.t,kind:e.kind||'info',title:auditText(e),sub:e.before||e.after?`${e.before?e.before+' → ':''}${e.after||''}`:''}));
  st.requests.filter(r=>r.field==='newAgent'&&r.by===ME&&r.status!=='pending').forEach(r=>out.push({t:r.dt||r.t,kind:r.status==='approved'?'create':'stop',title:r.status==='approved'?`${PA()} approved your new agent ${r.proposal.name}`:`${PA()} declined your request for ${r.proposal.name}`,sub:''}));
  st.requests.filter(r=>r.field!=='newAgent'&&ids.has(r.agent)&&r.status!=='pending'&&r.by===ME).forEach(r=>out.push({t:r.dt||r.t,kind:r.status==='approved'?'create':'stop',title:r.status==='approved'?`${PA()} approved your request${r.granted&&r.granted!==r.to?` at ${gbpS(r.granted)}`:''}`:'${PA()} declined your request',sub:`You asked for ${gbpS(r.to)} ${r.field==='perDay'?'per day':'per payment'}`}));
  if(seesReport()&&st.reportSent&&st.reportSent.to.includes(ME))out.push({t:st.reportSent.t,kind:'info',title:`${PA()} sent you the weekly report`,sub:'Open it from Home'});
  return out.sort((a,b)=>b.t-a.t);
}
function auditText(e){
  const a=ag(e.target), who=ADMIN_NAME[e.who]||PA(), n=a?a.name:'your agent';
  const m={'Created agent':`${who} gave you ${n}`,'Stopped agent':`${who} paused ${n}`,'Resumed agent':`${who} restarted ${n}`,'Undid stop':`${who} restarted ${n}`,'Revoked agent':`${who} removed ${n}`,'Renewed agent':`${who} renewed ${n}`,'Permission ended':`${n} has expired`};
  return m[e.act]||`${who} changed ${n}: ${e.act.toLowerCase()}`;
}

/* ---------- engine (same five checks as the dashboard) ---------- */
function authorise(a,seller,amount){
  const c=[
    ['Agent is on',()=>a.status==='active',a.status==='expired'?'Permission ended':`Paused by ${ADMIN_NAME[a.pausedBy]||PA()}`],
    ['Permission has not ended',()=>a.expires>new Date(),'Permission ended'],
    [`${seller} is an allowed shop`,()=>!!a.anySeller||a.sellers.includes(seller),'Shop not allowed'],
    [`Within ${gbpS(a.perPayment)} per payment`,()=>amount<=a.perPayment,`Over per-payment cap (${gbpS(a.perPayment)})`],
    [`Within ${gbpS(a.perDay)} per day`,()=>r2(today(a.id)+amount)<=a.perDay,`Over daily cap (${gbpS(a.perDay)})`],
  ];
  let fail=null;const trace=c.map(([k,t,why])=>{if(fail)return{k,s:'skip'};const ok=t();if(!ok)fail={why,k};return{k,s:ok?'pass':'fail'}});
  return{ok:!fail,reason:fail?fail.why:'',trace,failedCap:fail&&/cap/.test(fail.why)?(/daily/.test(fail.why)?'perDay':'perPayment'):null};
}

  ['Chemistry past papers pack','PaperStack',6],['Physics practice set','PaperStack',9],
  ['An Inspector Calls e-book','Study Books',4.99],['Macbeth study guide','Study Books',6.5],

const TILE_COLORS=['#3F51D8','#1E8A58','#B83266','#A86300','#7a5cd6','#0e7c8c'];
const tileColor=s=>TILE_COLORS[[...s].reduce((h,c)=>h+c.charCodeAt(0),0)%TILE_COLORS.length];
function shopFor(a){
  if(a.anySeller)return{allowed:PRODUCTS.slice(),others:[]};
  const allowed=PRODUCTS.filter(p=>a.sellers.includes(p.seller));
  a.sellers.filter(x=>!PRODUCTS.some(p=>p.seller===x)).forEach(x=>allowed.push({item:'Order from '+x,seller:x,price:Math.min(a.perPayment,8)}));
  const others=PRODUCTS.filter(p=>!a.sellers.includes(p.seller));
  const pickOthers=[others.find(p=>p.seller==='Game Store'),...others.filter(p=>p.seller!=='Game Store').slice(0,2)].filter(Boolean);
  return {allowed,others:pickOthers};
}

const newAgents=new Set();
let bannerT;
function banner(title,sub,kind='info'){
  const map={info:['in-ic','bell'],stop:['pa-ic','pause'],ok:['ok-ic','check'],up:['in-ic','up'],no:['no-ic','x']}[kind];
  const b=$('#banner');b.innerHTML=`<span class="ic ${map[0]}">${I(map[1])}</span><p><b>${esc(title)}</b>${esc(sub)}</p><small>now</small>`;
  b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('on'),4200);
}
function notifyDiff(a,b){
  const pa=new Map(a.agents.map(x=>[x.id,x]));
  b.agents.filter(x=>x.sponsor===ME).forEach(x=>{
    const o=pa.get(x.id);
    if(!o&&x.status!=='revoked'){newAgents.add(x.id);banner(`${PA()} gave you ${x.name}`,`${gbpS(x.perPayment)} per payment, ${gbpS(x.perDay)} per day.`,'ok');return}
    if(!o)return;
    if(o.status==='active'&&x.status==='paused'&&x.pausedBy!==ME)banner(`${x.name} paused`,`${PA()} stopped it. Purchases are blocked.`,'stop');
    else if(o.status!=='active'&&x.status==='active')banner(`${x.name} is back on`,`${PA()} restarted it.`,'ok');
    else if(x.status==='revoked'&&o.status!=='revoked')banner(`${x.name} removed`,`${PA()} removed this agent.`,'no');
    else if(o.perPayment!==x.perPayment||o.perDay!==x.perDay)banner('Your limits changed',`${x.name}: ${gbpS(x.perPayment)} per payment, ${gbpS(x.perDay)} per day.`,'up');
    else if(o.sellers.join()!==x.sellers.join())banner('Your shops changed',`${x.name} can now pay ${x.sellers.join(', ')}.`,'up');
  });
  const wasIn=(a.reportTo||[]).includes(ME), isIn=(b.reportTo||[]).includes(ME);
  if(!wasIn&&isIn)banner('Weekly report shared with you',`${PA()} added you. Open it from Home.`,'up');
  if(wasIn&&!isIn)banner('Weekly report turned off',`${PA()} stopped sharing it with you.`,'info');
  const ns=b.reportSent,os=a.reportSent; if(ns&&ns.to.includes(ME)&&(!os||+new Date(os.t)!==+new Date(ns.t)))banner('Your weekly report is here',`From ${PA()}. Tap Home to read it.`,'up');
  const om=(a.members||[]).find(x=>x.id===ME), nmm=(b.members||[]).find(x=>x.id===ME);
  if(om&&nmm&&om.name!==nmm.name)banner(`You’re now ${nmm.name}`,`${PA()} updated your name.`,'info');
  if(om&&nmm&&om.role!==nmm.role)banner(`Your role is now ${nmm.role}`,`Changed by ${PA()}.`,'info');
  const pr=new Map(a.requests.map(r=>[r.id,r.status]));
  b.requests.filter(r=>r.by===ME&&pr.get(r.id)==='pending'&&r.status!=='pending').forEach(r=>{
    if(r.field==='newAgent'){if(r.status!=='approved')banner('Request declined',`${PA()} said no to ${r.proposal.name}.`,'no');return}
    if(r.status==='approved')banner('Request approved',`${PA()} gave you ${gbpS(r.granted||r.to)} ${r.field==='perDay'?'per day':'per payment'}.`,'ok');
    else banner('Request declined',`${PA()} kept your limits the same.`,'no');
  });
}

let ask=null;
function openAsk(aid,field='perPayment',amt){
  const a=ag(aid); ask={aid,field,amt:amt||Math.ceil((field==='perDay'?a.perDay:a.perPayment)*1.5)};drawAsk();
}
function drawAsk(){
  const a=ag(ask.aid), cur=ask.field==='perDay'?a.perDay:a.perPayment;
  if(ask.amt<=cur)ask.amt=cur+1;
  openSheet(`<h3>Request more</h3><p>${PA()} gets this on the dashboard and decides how much.</p>
   <div class="seg"><button class="${ask.field==='perPayment'?'on':''}" data-afield="perPayment">Per payment</button><button class="${ask.field==='perDay'?'on':''}" data-afield="perDay">Per day</button></div>
   <p style="text-align:center">Now ${gbpS(cur)}. Ask for:</p>
   <div class="stepper"><button data-astep="-1" aria-label="Less">−</button><span class="v num">£${ask.amt}</span><button data-astep="1" aria-label="More">+</button></div>
   <input class="inp" id="askNote" placeholder="Why? e.g. The maths bundle is £15" value="">
   <button class="btn pri" id="sendAsk">${I('up')}Send to ${PA()}</button><button class="btn sec" data-close>Cancel</button>`);
}
const CATS={education:['Study shops',['Revision Hub','PaperStack','Study Books'],'book'],gifts:['Gifts',['John Lewis','Etsy','Not On The High Street'],'gift'],grocery:['Groceries',['Tesco',"Sainsbury's",'Ocado'],'cart'],travel:['Travel',['LNER','Trainline','British Airways','Booking.com','Enterprise'],'plane'],games:['Games',['Game Store'],'megaphone'],research:['Research',['FT.com','Nature','JSTOR','Statista API','Perplexity API'],'search']};
let na=null;
function openNewAgent(){na={name:'',purpose:'',cat:'gifts',pp:20,pd:40};drawNewAgent()}
function drawNewAgent(){
  openSheet(`<h3>Ask for a new agent</h3><p>${esc(PA())} sees this on the dashboard and decides the limits.</p>
   <input class="inp" id="naName" placeholder="Name, e.g. Gift Finder" value="${esc(na.name)}" aria-label="Agent name">
   <input class="inp" id="naPurpose" placeholder="What it buys, e.g. Birthday presents for friends" value="${esc(na.purpose)}" aria-label="What it buys">
   <p style="color:var(--ink);font-weight:600">Where it would shop</p>
   <div class="chips" style="flex-wrap:wrap">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${na.cat===k?'on':''}" data-nacat="${k}">${c[0]}</button>`).join('')}</div>
   <div class="row"><div style="flex:1;text-align:center"><p>Per payment</p><div class="stepper"><button data-nastep="pp" data-d="-5">−</button><span class="v num" style="font-size:26px;min-width:70px">£${na.pp}</span><button data-nastep="pp" data-d="5">+</button></div></div>
   <div style="flex:1;text-align:center"><p>Per day</p><div class="stepper"><button data-nastep="pd" data-d="-5">−</button><span class="v num" style="font-size:26px;min-width:70px">£${na.pd}</span><button data-nastep="pd" data-d="5">+</button></div></div></div>
   <input class="inp" id="naNote" placeholder="Why? e.g. Mia’s birthday is next week" aria-label="Why">
   <button class="btn pri" id="naSend">${I('up')}Send to ${esc(PA())}</button><button class="btn sec" data-close>Cancel</button>`);
}
function sendNewAgent(){
  na.name=$('#naName').value.trim();na.purpose=$('#naPurpose').value.trim();
  if(na.name.length<2){$('#naName').focus();$('#naName').style.borderColor='var(--stop)';return}
  const c=CATS[na.cat];
  st.requests.push({id:rid('r'),agent:null,by:ME,field:'newAgent',proposal:{name:na.name,purpose:na.purpose||'Things I need',cat:na.cat,icon:c[2],sellers:c[1],perPayment:na.pp,perDay:Math.max(na.pd,na.pp)},note:$('#naNote').value.trim(),status:'pending',t:new Date()});
  save();closeSheet();render();banner('Request sent',`${PA()} will see “${na.name}” on the dashboard.`,'up');
}
function sendAsk(){
  const a=ag(ask.aid), cur=ask.field==='perDay'?a.perDay:a.perPayment;
  st.requests.push({id:rid('r'),agent:a.id,by:ME,field:ask.field,from:cur,to:ask.amt,note:$('#askNote').value.trim()||'Need a bit more for revision.',status:'pending',t:new Date()});
  save(); closeSheet(); render(); banner('Request sent',`Asked ${PA()} for ${gbpS(ask.amt)} ${ask.field==='perDay'?'per day':'per payment'}.`,'up');
}
function stopMine(aid){const a=ag(aid);a.status='paused';a.pausedBy=ME;a.pausedAt=new Date();st.audit.push({who:ME,act:'Stopped agent',target:aid,before:'Active',after:'Paused',t:new Date(),kind:'stop'});save();render();banner(`${a.name} stopped`,'It can’t buy anything now.','stop')}
function resumeMine(aid){const a=ag(aid);if(a.expires<new Date())return;a.status='active';delete a.pausedBy;st.audit.push({who:ME,act:'Resumed agent',target:aid,before:'Paused',after:'Active',t:new Date(),kind:''});save();render();banner(`${a.name} is back on`,'','ok')}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.report){openReport();return}
  if(t.id==='newAgentBtn'){openNewAgent();return}
  if(d.nacat){na.name=$('#naName').value;na.purpose=$('#naPurpose').value;na.cat=d.nacat;drawNewAgent();return}
  if(d.nastep){na[d.nastep]=Math.max(5,na[d.nastep]+(+d.d));t.parentElement.querySelector('.v').textContent='£'+na[d.nastep];return}
  if(t.id==='naSend'){sendNewAgent();return}
  if(d.tab){tab=d.tab;render();$('#body').scrollTop=0;return}
  if(t.id==='bellBtn'){tab='alerts';render();return}
  if(d.goshop){shopAgent=d.goshop;tab='shop';render();return}
  if(d.pick){shopAgent=d.pick;render();return}
  if(d.buy!==undefined){buy(d.buy);return}
  if(d.stop){stopMine(d.stop);return}
  if(d.resume){resumeMine(d.resume);return}
  if(d.ask){openAsk(d.ask,d.field,d.amt?+d.amt:0);return}
  if(d.afield){ask.field=d.afield;ask.amt=0;const a=ag(ask.aid);ask.amt=Math.ceil((ask.field==='perDay'?a.perDay:a.perPayment)*1.5);drawAsk();return}
  if(d.astep){ask.amt=Math.max(1,ask.amt+(+d.astep)*(ask.amt>=50?5:1));$('.stepper .v').textContent='£'+ask.amt;return}
  if(t.id==='sendAsk'){sendAsk();return}
  if(d.close!==undefined){closeSheet();return}
});
$('#scrim').onclick=closeSheet;
setInterval(()=>{if(!sheet)render()},30000);
setInterval(()=>{try{const s=localStorage.getItem(KEY);if(s&&s!==lastSaved)onRemote(s)}catch(e){}},1500);


/* extra channels: parent frame relay (demo page) + optional sync server (node server.js, works across devices) */
const inFrame=window.self!==window.top;
let server=false;
function sendOut(str){
  if(inFrame){try{parent.postMessage({fw:'state',str},'*')}catch(e){}}
  if(server)fetch('api/state',{method:'POST',body:str,headers:{'Content-Type':'text/plain'}}).catch(()=>{});
}
addEventListener('message',e=>{const d=e.data;if(!d||!d.fw)return;if(d.fw==='state')onRemote(d.str);if(d.fw==='reset')location.reload()});
async function connectServer(onFirst){
  try{
    const r=await fetch('api/state',{cache:'no-store'});
    if(r.status!==200&&r.status!==204)return;
    server=true;
    if(r.status===200){const s=await r.text();if(s)onFirst(s)}else if(lastSaved)sendOut(lastSaved);
    const es=new EventSource('api/events');
    es.onmessage=ev=>{const m=JSON.parse(ev.data);if(m.type==='state')onRemote(m.str);if(m.type==='reset')location.reload()};
  }catch(e){}
}
load(); render(); booted=true;
connectServer(str=>{st=parse(str);lastSaved=str;try{localStorage.setItem(KEY,str)}catch(e){}render()});
})();
</script>
</body></html>
